{% extends "base.html" %}
{% block title %}Ask{% endblock %}
{% block content %}
<main class="page">
    <header class="page-header">
        <h1>Ask Elevanta</h1>
        <p>Ask a business question and get a practical answer.</p>
    </header>

    <section class="card">
        <form method="post">
            <div class="input-group">
                <label for="question">Question</label>
                <input type="text" id="question" name="question" required placeholder="How can I improve cash flow?" value="{{ question or '' }}">
            </div>
            <div class="actions">
                <button type="submit" class="btn btn-primary">Ask</button>
            </div>
        </form>
        {% if answer %}
        <pre class="answer visible">{{ answer }}</pre>
        {% endif %}
    </section>
</main>
{% endblock %}
