<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly Profit Chart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <header class="bg-dark text-white text-center p-3 ">
        <h1>Monthly Profit Chart</h1>
    </header>

    <main class="container py-4"> 
        <div class="card shadow-sm mx-auto p-2" style="max-width: 980px">
            <div class="card-body">

            <div id="status" class="alert alert-info py-2">
                Ready to save weekly profit data
            
            </div>
                <label class="form-label">Date</label>
                <input type="date" id="date" class="form-control">
            </div>

            <div class="mt-4 m-3">
                <label class="form-label">Profit</label>
                <input type="number" id="profit" class="form-control">
            </div>

            <div class="d-flex gap-2 mt-4 m-3">
                <button class="btn btn-dark" id="saveBtn">Save</button>
            </div>
        </div>
    </main>
    
    
    
    <div class="card shadow-sm mx-auto" style="max-width: 980px">
            <div class="card-body">
                
                <p class="card-text">This is a simple chart showing monthly profit.</p>

                <div class="alert alert-info py-2" id="status">
                    Pick a date range to see the profit.
                </div>
                    
                <div class="row g-3">
                    <div class ="col-12 col-md-6">
                        <label class ="form-label" for="start">Start Date</label>
                        <input type="date" id="start" name="date" class ="form-control">
                    </div>
                    <div class ="col-12 col-md-6">
                        <label class ="form-label" for="end">End Date</label>
                        <input type="date" id="end" name="date" class ="form-control">
                        <small id="endDateError" class="text-danger"></small>
                    </div>
                </div>

                <div class="mt-3" style="height: 400px">
                    <canvas id="profitChart"></canvas>
                </div>

                <div>
                    <a class="btn btn-outline-primary" href="/">Back to Dashboard</a>
                    <button class="btn btn-dark" id ="refreshBtn">Refresh</button>
                </div>
            </div>
        </div>
</body>
</html>
